apply plugin: 'com.android.application'

// Signing credentials live in android/keystore.properties, which is gitignored.
// The previous repo hard-coded them in this file; that leaked them into git
// history and they cannot be rotated without breaking Play update signatures.
// Not repeating the mistake here. Without the file, release simply goes
// unsigned and debug still builds.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace = "ir.physicalme.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ir.physicalme.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Same pattern as the app this replaces: CI passes the real numbers,
        // a plain `gradlew assembleDebug` still works without arguments.
        // WARNING: the old repo derived versionCode from github.run_number,
        // which restarts at 1 in this repo. A release upload must be given a
        // code above whatever the Play listing already has. See NOTES.md.
        versionCode Integer.parseInt(project.hasProperty('pmVersionCode') ? project.pmVersionCode : '1')
        versionName project.hasProperty('pmVersionName') ? project.pmVersionName : '0.2.0'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystoreProps['storeFile']) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Must be the same certificate the Play listing already carries,
            // or the install is rejected as a different app.
            if (keystoreProps['storeFile']) signingConfig signingConfigs.release
        }
        debug {
            // The shipping app owns ir.physicalme.app on this phone, signed with
            // the release key. A debug build carries the generic Android debug
            // certificate, so installing it over that app fails outright — and
            // if it did succeed it would replace a working app with one still
            // running on the mock data layer. The suffix makes it a separate
            // package that sits beside the real one instead of fighting it.
            applicationIdSuffix '.dev'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
